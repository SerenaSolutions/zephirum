name: CI
on: [push, pull_request]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build C decision core
        run: make -C src
      - name: Cross-check C core vs Python reference (soundness-first)
        run: python3 tests/cross_check_c.py
      - name: Multi-target emission smoke (geometric family)
        run: python3 prototype/zephirum_transpiler_multi.py examples/geometric.zeph > /dev/null
      - name: Receipt chain battery (replay/tamper)
        run: |
          cc -O2 -o /tmp/test_chain c-api/zyql.c c-api/tests/test_chain.c -lm
          /tmp/test_chain
      - name: ZEPHIRUM language regression (6/6 + AI builtins)
        run: |
          pip install numpy pqcrypto -q
          cd quantum_language/cefirum
          for p in hello bell selftest kaplansky divisor quantum test_ai; do
            python3 cefirum.py run $p.cef > /dev/null || exit 1
          done
      - name: ZYQL Sentinel + ProofChain product battery (P1+P3 MVP)
        run: |
          pip install pqcrypto -q
          python3 products/sentinel/test_sentinel.py
      - name: DOT Agent MVP battery (computer + policy + receipts)
        run: |
          pip install pqcrypto -q
          python3 products/dot/test_dot.py
      - name: Scientific conformance suite (v0.3 standard + falsification)
        run: |
          pip install ./plugin -q
          python3 prototype/conformance_v03.py
          python3 prototype/falsification_200.py
